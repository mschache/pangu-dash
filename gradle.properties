karoopro.releaseNotes=New Descent panel, the Climb panel's mirror for descents on a navigated route: distance and height to the bottom, average grade left, speed, time to the bottom and the steepest stretch still ahead (red from 10 %), over the descent's profile in blues. It opens by itself as each descent starts and goes back at the bottom (toggle in settings), Dash Panels gets it as a slide, and the map can show descents as a blue band (off by default).
